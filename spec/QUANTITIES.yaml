- id: grader.allocation
  unit:
    as_printed: plan
    dimension: OPEN
    per: OPEN
    scale: OPEN
    open_reason: the unit is recorded as one undecomposed token and no Unit body is given anywhere;
      this token does not decompose unambiguously into dimension/per/scale.
  invariance_group: units
  min_access: derived
  rungs: 2
  instrument:
  - A5
  wedge: false
  # Lifted from the `Quantity` this package has carried since it was written. The module
  # held the definition because `spec/QUANTITIES.yaml` was not that module's file to write,
  # and `test_the_registry_carries_no_definition_for_any_of_them` was left as a tripwire so
  # the duplicate would be deleted when the row landed rather than drifting against it.
  definition: >-
    The four-tuple (n prompts, K rollouts per prompt, s grader draws per rollout, m repeat calls per
    draw) that minimises a stated error variance subject to a stated cost constraint, together with
    the error variance it achieves and the error variance the current allocation achieves. The error
    variance is one of three: the batch relative error (sigma2(p) + sigma2(delta; s, m)) / (n*K),
    the batch absolute error which adds sigma2(Delta) - sigma2(delta), or the per-advantage error
    sigma2(delta; s, m) * (1 - 1/K). sigma2(delta) and sigma2(Delta) are the D-study relative and
    absolute error variances of the crossed design that produced the components. The plan is a
    decision and not a measurement: it is exact arithmetic on estimated components and inherits
    their uncertainty.
  interpretation: >-
    Read the ratio, not the tuple. A plan that moves 30% of the spend from rollouts to grader
    replications and cuts the error variance by 22% is a 22% cut for free; the same plan on a grader
    whose sigma2(delta) is already small will move nothing, and that is the answer too.
  support: OPEN
