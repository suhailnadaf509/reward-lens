- id: judge.commitment_position
  # Amended. This row declared `token idx` (count per token) under `tokenization`, and
  # `tokenization` admits **only** `invariant`, so the row asserted that a raw token index does not
  # move under retokenisation. It does: that is what retokenisation is. The unit and the invariance
  # group were making incompatible claims and the group was the one telling the truth.
  #
  # Same defect as A6's, which is why the fix is the same shape: the quantity becomes the thing that
  # actually holds the declared invariance. A **fraction of the generated sequence** is stable under
  # retokenisation where an index is not, so the fraction is the quantity and the index travels
  # beside it as presentation. Found in the module that computes it, which had already declared the
  # fraction and recorded the index in `deviations` rather than declaring an invariance it could
  # not defend.
  unit:
    as_printed: fraction of sequence
    dimension: fraction
    per: sequence
    scale: null
  invariance_group: tokenization
  min_access: GRADER:FORWARD
  rungs: 2
  instrument:
  - C8
  wedge: false
  support:
  - 0.0
  - 1.0
  definition: >-
    The position at which a judge's verdict direction becomes fixed, as a fraction of its own
    generated sequence: 0.0 if it is committed before generating anything and 1.0 if the verdict is
    only determined at the final token. Reported as a fraction rather than as a token index because
    the quantity is declared invariant under retokenisation and an index is not.
  interpretation: OPEN
  support: OPEN
