# ---------------------------------------------------------------------------
# The shipped battery and index corpus.
#
# The source documents say the 2.0.1 observables "survive as instruments here", and then give none
# of them a quantity-table row: the catalogue's C series is C1 to C8 and covers none of the shipped
# battery. So 28 of the 29 retrofitted instruments had no quantity to declare, and an instrument
# whose quantity is not registered fails at import by design. These 28 rows are what the retrofit
# measured off the implementations, one per instrument, at rung 1.
#
# None is in the wedge: this is the white-box corpus, which needs GRADER:FORWARD at minimum.
# The 29th, Chi, declares the existing `selection.differential_S`.
# ---------------------------------------------------------------------------
- id: grader.crystallization_depth
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: depth
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - LensCrystallization
  wedge: false
  definition: The layer index, as a fraction of depth, at which the chosen-minus-rejected projection of
    the residual stream onto the reward direction first reaches half its final value.
  interpretation: How deep in the network the preference forms. Near 0 means the reward is decided at
    the embedding; near 1 means it is decided in the last blocks.
  errata: E19
- id: grader.component_attribution
  unit:
    as_printed: reward
    dimension: reward
    per: component
    scale: raw
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - DirectLinearAttribution
  wedge: false
  definition: 'The signed contribution of one additive residual-stream component to the chosen-minus-rejected
    reward differential, as that component''''s output projected onto the reward direction. Exact: the
    contributions sum to the differential.'
  interpretation: Which parts of the network carry the preference, observationally. It is not a causal
    claim and it does not survive compensation by other components.
  errata: E19
- id: grader.component_patch_effect
  unit:
    as_printed: reward
    dimension: reward
    per: component
    scale: raw
  invariance_group: repr.basis
  min_access: GRADER:FORWARD|MUTATE
  rungs: 1
  instrument:
  - PatchGrid
  wedge: false
  definition: The reduction in the chosen-minus-rejected reward differential when one component's activation
    is replaced by the rejected side's, holding everything else clean.
  interpretation: 'Which components are causally necessary for the preference. Necessity only: it tests
    nothing about sufficiency and carries no rescue arm.'
  errata: E19
- id: grader.path_effect
  unit:
    as_printed: reward
    dimension: reward
    per: null
    scale: raw
  invariance_group: repr.basis
  min_access: GRADER:FORWARD|MUTATE
  rungs: 1
  instrument:
  - PathEffect
  wedge: false
  definition: The reduction in the reward differential when only the sender-head to receiver path carries
    the source-side activation and every other path stays clean.
  interpretation: Whether a component's effect flows through one particular downstream route rather than
    through the network at large.
  errata: E19
- id: grader.concept_dose_slope
  unit:
    as_printed: reward/unit
    dimension: reward
    per: unit_steer
    scale: raw
  invariance_group: repr.basis
  min_access: GRADER:FORWARD|MUTATE
  rungs: 1
  instrument:
  - ConceptDoseResponse
  wedge: false
  definition: The least-squares slope of the reward against steering strength along a unit concept direction
    added at the final-token residual.
  interpretation: How much reward one unit of a concept buys. A concept with a large slope is a lever
    an optimiser can pull.
  errata: E19
- id: grader.surface_bias_d
  unit:
    as_printed: d
    dimension: effect_size
    per: null
    scale: standardised
  invariance_group: reward.affine
  min_access: GRADER:QUERY
  rungs: 1
  instrument:
  - BiasBattery
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: One-sample Cohen's d of the chosen-minus-rejected reward delta on one surface axis, reported
    beside the lineage-honest effective sample size of its seeds.
  interpretation: How strongly the grader prices a surface change that should not matter. Standardised,
    so it is comparable across graders.
  errata: E19
- id: grader.prompt_snr
  unit:
    as_printed: ratio
    dimension: ratio
    per: null
    scale: power
  invariance_group: reward.affine
  min_access: GRADER:QUERY
  rungs: 1
  instrument:
  - PromptSNR
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The power ratio mean(delta)^2 / var(delta) of the chosen-minus-rejected reward delta across
    one axis's stimuli.
  interpretation: Whether an axis's preference signal rises above the spread of that signal. A lower bound
    on the robustness SNR, not an estimate of it.
  errata: E19
- id: grader.term_conflict
  unit:
    as_printed: cos
    dimension: correlation
    per: pair
    scale: null
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - ConflictMatrix
  wedge: false
  definition: The pairwise cosine between reward-term directions, each estimated as the mean chosen-minus-rejected
    activation difference for one quality axis.
  interpretation: Whether two quality axes cooperate, are independent, or pull against each other inside
    one model's representation.
  errata: E19
- id: grader.circuit_overlap
  unit:
    as_printed: jaccard
    dimension: fraction
    per: null
    scale: null
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - CircuitJaccard
  wedge: false
  definition: The Jaccard index of the top-k attributed components of two reward models on the same view,
    matched by component name.
  interpretation: Whether two reward models route the preference through the same parts of the network.
    Requires a shared architecture.
  errata: E19
- id: grader.feature_alignment
  unit:
    as_printed: reward/feature
    dimension: reward
    per: feature
    scale: raw
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - FeatureRewardAlignment
  wedge: false
  definition: The per-feature inner product of a sparse autoencoder's decoder columns with the reward
    direction, W_dec @ w_r.
  interpretation: Which dictionary features move the reward and in which direction. It says nothing about
    whether those features ever fire.
  errata: E19
- id: grader.objective_geometry
  unit:
    as_printed: cos
    dimension: correlation
    per: pair
    scale: null
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - MultiObjectiveGeometry
  wedge: false
  definition: The pairwise cosine matrix of a multi-objective head's per-objective readout vectors, never
    the row-mean composite.
  interpretation: Whether a multi-objective reward's objectives cooperate or conflict in weight space.
    Weight geometry only; it never looks at an activation.
  errata: E19
- id: grader.criterion_coherence
  unit:
    as_printed: cos
    dimension: correlation
    per: pair
    scale: null
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - Coherence
  wedge: false
  definition: The Gram matrix of unit-normalised criterion directions, with the Welch floor for (K, d)
    and the participation ratio d_eff of the spanned subspace.
  interpretation: Whether a reward is carrying more criteria than its effective dimension supports, past
    which the criteria must contaminate one another.
  errata: E19
- id: grader.contested_axis
  unit:
    as_printed: r
    dimension: correlation
    per: null
    scale: null
  invariance_group: repr.basis
  min_access: RECORD:RECORD
  rungs: 1
  instrument:
  - Contested
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The correlation between the disagreement signal and its projection onto the covariance direction
    of the per-pair activation difference with that signal.
  interpretation: How much annotator disagreement is organised along a single representation axis rather
    than scattered.
  errata: E19
- id: grader.coverage_disparity
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: null
  invariance_group: none
  min_access: RECORD:RECORD
  rungs: 1
  instrument:
  - CoverageDisparity
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: 'The spread of per-property reward coverage across a battery: the range, the standard deviation,
    and the mean absolute difference.'
  interpretation: How unequally a reward covers the properties in a battery. This is v1's coverage statistic,
    not Wang-Huang distortion.
  errata: E19
- id: grader.dark_fraction
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: variance
  invariance_group: reward.affine
  min_access: GRADER:QUERY
  rungs: 1
  instrument:
  - DarkReward
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: One minus the R-squared of the reward regressed on the named-channel contributions, with
    a constant term.
  interpretation: 'The share of reward variance no named channel explains. A residual: it attributes nothing,
    it only says something is unaccounted for.'
  errata: E19
- id: grader.distortion_index
  unit:
    as_printed: reward/unit
    dimension: reward
    per: unit_direction
    scale: raw
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - Distortion
  wedge: false
  definition: Per-dimension distortion D(P) = sensitivity(P) * (1 - coverage(P)), with sensitivity defaulting
    to the linear proxy |w_r . v_P| and coverage supplied by the knowledge-utilization mediation term.
  interpretation: Where a reward is sensitive to a property it does not intend to price. High sensitivity
    that is fully covered is intended pricing, not distortion.
  errata: E19
- id: grader.eval_awareness
  unit:
    as_printed: accuracy
    dimension: probability
    per: null
    scale: balanced
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - EvalAwareness
  wedge: false
  definition: The held-out balanced accuracy of a mean-difference linear probe discriminating benchmark-style
    from organic inputs on the grader's activations.
  interpretation: Whether the grader can tell a test from real traffic. Presence of the information, not
    use of it; the causal half needs a steering arm.
  errata: E19
- id: instrument.interp_coverage
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: null
  invariance_group: none
  min_access: RECORD:RECORD
  rungs: 1
  instrument:
  - InterpCoverage
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The share of attributed reward magnitude carried by interpretable feature nodes rather than
    by reconstruction-error nodes.
  interpretation: How much of a reward an attribution graph actually explains. It measures reconstruction
    and is routinely read as interpretability.
  errata: E19
- id: grader.knowledge_utilization
  unit:
    as_printed: pct
    dimension: percentile
    per: null
    scale: within_battery
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - KUI
  wedge: false
  definition: The signed distance from the diagonal in the (decodability, mediation) plane, both axes
    standardised to percentile-within-battery before subtraction.
  interpretation: Which properties a reward represents but does not price. Relative to the battery supplied,
    so two batteries give incomparable numbers.
  errata: E19
- id: grader.legibility_frontier
  unit:
    as_printed: rho
    dimension: correlation
    per: null
    scale: spearman
  invariance_group: reward.affine
  min_access: GRADER:QUERY
  rungs: 1
  instrument:
  - Legibility
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The Spearman rank agreement between the reward and a least-squares program built from predicates
    within a description-length budget, as a function of that budget, with its knee and the tacit residual.
  interpretation: How short a program has to be before it stops tracking the reward. Bounded by the predicate
    library supplied, not by what is expressible.
  errata: E19
- id: grader.receipt_reliance
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: RECORD:RECORD
  rungs: 1
  instrument:
  - ReceiptReliance
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The share of the corruption reward effect attributable to receipt spans, as the ratio of
    the falsify-receipt arm delta to the total corruption delta.
  interpretation: Whether a reward grounds its judgment in the receipts or in the narrative gloss around
    them.
  errata: E19
- id: grader.skepticism
  unit:
    as_printed: reward
    dimension: reward
    per: null
    scale: raw
  invariance_group: reward.affine
  min_access: RECORD:RECORD
  rungs: 1
  instrument:
  - Skepticism
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: S = r(claim, receipt absent) - r(claim, receipt showing failure) at matched narrative.
  interpretation: Whether a missing receipt is read as failure (S near 0, skeptical) or rewarded over
    disclosure (S well above 0, credulous). Carries reward-scale units.
  errata: E19
- id: grader.robustness_snr
  unit:
    as_printed: ratio
    dimension: ratio
    per: null
    scale: variance
  invariance_group: reward.affine
  min_access: GRADER:QUERY
  rungs: 1
  instrument:
  - RobustnessSNR
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The variance of the paraphrase-cluster reward means over the mean within-cluster reward
    variance.
  interpretation: Whether a reward's between-condition ordering survives meaning-preserving perturbation.
    Near one, any ranking read off it is fragile.
  errata: E19
- id: grader.style_share
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: null
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - StyleShare
  wedge: false
  definition: The fraction of the reward change w_r . delta_h carried by the projection of delta_h onto
    the style subspace.
  interpretation: How much of a correctness reward gap the reward is reading off style. Does not partition
    with the verification score; the remainder is unexplained.
  errata: E19
- id: grader.tail_index
  unit:
    as_printed: xi
    dimension: shape
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:QUERY
  rungs: 1
  instrument:
  - TailIndex
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The generalized-Pareto shape parameter of the reward's right tail, fitted by the method
    of moments over peaks above a quantile threshold and cross-checked against a Hill estimate.
  interpretation: Whether optimisation pressure against this reward has a finite safe budget. A polynomial
    tail puts the critical pressure at zero.
  errata: E19
- id: grader.induced_variance
  unit:
    as_printed: reward^2
    dimension: variance
    per: null
    scale: raw
  invariance_group: repr.basis
  min_access: GRADER:FORWARD
  rungs: 1
  instrument:
  - TeacherCompatibility
  wedge: false
  definition: The reward variance a policy's own samples induce, w_r' Sigma_pi w_r, decomposable by layer
    and over the eigenbasis of Sigma.
  interpretation: Whether a reward model is a usable teacher for a given policy. A reward whose scores
    barely move across a policy's samples teaches it nothing.
  errata: E19
- id: grader.value_convergence_excess
  unit:
    as_printed: align
    dimension: alignment
    per: null
    scale: canonicalised
  invariance_group: repr.basis
  min_access: RECORD:RECORD
  rungs: 1
  instrument:
  - VCE
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The reward-subspace alignment of a reward-model pair minus their matched capability-subspace
    alignment, both on frame-canonicalised subspaces at the same layers, read against the random-utility
    identifiability null.
  interpretation: Whether two reward models agree on what they reward beyond how much they agree on what
    they know.
  errata: E19
- id: grader.verification_score
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: RECORD:RECORD
  rungs: 1
  instrument:
  - VerificationScore
  # Amended: in the wedge on this row's own `min_access`. The retrofit marked all 28 rows out of
  # it on the claim that the 2.0.1 corpus needs `GRADER: FORWARD`, and thirteen of them do not.
  wedge: true
  definition: The share of the clean-versus-corrupted reward gap causally attributable to the labelled
    error span, by patching the clean twin's error-span activations into the corrupted run.
  interpretation: Whether a process reward is checking the work or reacting to surface style. Rises with
    span width for reasons unrelated to verification.
  errata: E19

# ---------------------------------------------------------------------------
# The controls bank (M3 and M4).
#
# M3 to M8 carry `quantities: OPEN` in the catalogue, so the four control instruments every
# other series has to ship against had nothing to declare. M5 declares the existing `study.power`
# and M10 already owns its three, so only these two instruments needed new ids.
#
# `reward.affine` here is a real generated test rather than a formality: every baseline reads the
# transcript and the label and never the reward, so a control reading that moves when the reward
# is rescaled is reading the very thing it exists to be a control for.
# ---------------------------------------------------------------------------
- id: baseline.best_score
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - M3
  wedge: true
  definition: 'The discrimination achieved on a claim''s own task by the strongest member of the six-baseline
    bank: the area under the ROC curve of that baseline''s per-item scores against the claim''s labels.'
  interpretation: The floor a claim has to clear. A claim whose own discrimination does not exceed this
    has not been shown to detect anything a zero-parameter comparator could not.
  support:
  - 0.0
  - 1.0
  errata: E22
- id: baseline.margin
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - M3
  wedge: true
  definition: A claim's own discrimination minus the strongest baseline's, computed on the same items
    with the pairing preserved, so the interval on the difference is narrower than the two marginal
    intervals would suggest.
  interpretation: Positive with an interval excluding zero is a win. An interval containing zero is
    a match, and a match reported as a win is the failure the bank exists to catch.
  support:
  - -1.0
  - 1.0
  errata: E22
- id: placebo.effect_ratio
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - M4
  wedge: true
  definition: The effect of a coherent semantically irrelevant direction, applied at the same norm and
    the same dose, divided by the effect of the claimed direction on the same outcome.
  interpretation: 1.0 means a direction with no relation to the claim did the intervention's work, so
    the claim does not describe what happened. Near 0 means the effect is specific to the claimed direction.
    Values above 1 happen and mean the placebo did more.
  support: OPEN
  errata: E22
# --- Series N, Level 0: the frontier. Registered here, not by the source table. -----------------
# Every catalogue series was scheduled except the two bodies of mathematics the source documents
# develop in full and that need only a callable grader and a gold channel on the same n samples:
# the frontier and the contract layer. Neither has a quantity-table row, so every field below is
# this build's judgement from that mathematics rather than the specification's, and is marked so.
# The build checks them against it and reports what is wrong rather than editing them.
- id: frontier.gold_vs_kl
  unit:
    as_printed: reward
    dimension: reward
    per: sequence
    scale: raw
  invariance_group: reward.affine
  min_access: GRADER:QUERY+GOLD:QUERY+POLICY:QUERY
  rungs: 1
  instrument:
  - N1
  wedge: true
  definition: E_lambda[g] as a function of KL(pi_lambda || pi_0) over the exponential tilt family,
    estimated on n base-policy rollouts scored by both the proxy r and the gold channel g with
    w_i = exp(lambda r_i). Both axes are ratios of weighted means, so the curve needs no optimisation
    run to exist.
  interpretation: Where the curve turns is where further optimisation against the proxy stops buying
    gold. It is a statement about g, not about anything g stands for, and it is only defined out to
    the visibility horizon.
  support: null
  errata: E23
- id: frontier.visibility_horizon
  unit:
    as_printed: nats
    dimension: nats
    per: sequence
    scale: nats
  invariance_group: reward.affine
  min_access: GRADER:QUERY+POLICY:QUERY
  rungs: 1
  instrument:
  - N2
  wedge: true
  definition: The largest KL(pi_lambda || pi_0) at which the Kish effective sample size
    ESS(lambda) = (sum w_i)^2 / sum w_i^2 still clears a stated floor, default 0.05 of n. Reported in
    nats rather than in lambda because lambda carries the reciprocal of the reward's scale and is not
    comparable across graders; the instrument reports lambda_max and n/ESS alongside.
  interpretation: Past this point the tilt estimate is carried by a handful of rollouts and the
    instrument declines to answer. It is the reciprocal of the best-of-n coverage coefficient
    C = 1 + chi^2(pi* || pi_ref) = n/ESS, which the coverage literature leaves unmeasured.
  support:
  - 0.0
  - null
  errata: E23
- id: frontier.tail_index
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:QUERY+POLICY:QUERY
  rungs: 1
  instrument:
  - N3
  wedge: true
  definition: The extreme value index of the reward's upper tail, reported with the estimator's plot
    over the threshold choice rather than as a point estimate at one k. Hill is reported because it
    is what makes us comparable to the one published measurement; Pickands carries the LIGHT_TAILED
    verdict, because Hill is exactly scale invariant
    and not location invariant, and its support is positive so it can never return evidence of
    light-tailedness.
  interpretation: The LIGHT_TAILED precondition the whole tilt layer rests on, because K(lambda) is
    finite only if the moment generating function exists. Strictly the condition is gamma <= 0, and
    an exactly Gaussian tail gives a Hill estimate near 0.196 at these thresholds, which is what the
    cited 0.20 is consistent with. A defensible estimate needs about 1,570 exceedances, which is
    31,400 prompts at q = 0.95; below that the instrument refuses rather than reporting a number from
    200 prompts.
  support:
  - null
  - null
  errata: E23
- id: frontier.prentice_checklist
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:QUERY+GOLD:QUERY+POLICY:QUERY
  rungs: 1
  instrument:
  - N4
  wedge: true
  definition: >-
    A per-criterion pass, fail or untestable verdict on the four surrogate-endpoint conditions under
    which optimising the proxy cannot harm the gold. They are Prentice (1989), Freedman's proportion
    of treatment effect explained (1992), Buyse and Molenberghs individual-level against trial-level
    association (1998), and VanderWeele's monotonicity conditions excluding the surrogate paradox
    (2013).
  interpretation: A failed criterion names the condition the proxy violates, which is a stronger and
    more actionable statement than a predicted turning point. Criterion 4 usually returns untestable
    without an intervention, and reporting that honestly is the point rather than a shortfall.
  support: null
  errata: E23
- id: frontier.concomitant_bon
  unit:
    as_printed: reward
    dimension: reward
    per: sequence
    scale: raw
  invariance_group: reward.affine
  min_access: GRADER:QUERY+GOLD:QUERY+POLICY:QUERY
  rungs: 1
  instrument:
  - N4
  wedge: true
  definition: The expected gold score of the response that maximises the proxy among n draws, which
    is the concomitant of the nth order statistic, computed from the finite-n distribution theory
    rather than by simulation.
  interpretation: Best-of-n Goodhart is a concomitant problem, and the exact finite-n answer has been
    available for forty years. The reading is exact at the stated n rather than asymptotic.
  support: null
  errata: E23
# --- Rows requested by the modules that needed them, registered centrally. -----------------------
# Each was proposed by the package that needed it, in a report, rather than edited into this file
# directly. Every one is the same recorded defect: the specification
# names a quantity in prose or in an instrument entry and the quantity table gives it no row.
- id: grader.abstention_rate
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: none
  min_access: GRADER:RECORD
  rungs: 2
  instrument:
  - B4
  wedge: true
  definition: >-
    The fraction of grader calls that declined to score, counting a leaf whose value is None with
    abstained set. It is not the silent-zero rate. A silent zero is the subset where a number was
    substituted for the decline, so a grader with a working abstention channel has a silent-zero
    rate of zero and an abstention rate that is not.
  interpretation: A rollout whose grader abstained must receive no advantage. It is a first-class
    reported quantity in its own right, not merely the subset the silent-zero rate covers.
  support:
  - 0.0
  - 1.0
  errata: E29
- id: intervention.att_staggered
  unit:
    as_printed: OPEN
    dimension: OPEN
    per: OPEN
    scale: OPEN
    open_reason: the quantity is named in prose and has no unit row of its own
  invariance_group: reward.affine
  min_access: OPEN
  rungs: 0
  instrument: OPEN
  wedge: false
  definition: The average effect on the treated of an intervention introduced partway through a run,
    where different arms adopt at different steps.
  interpretation: OPEN
  support: OPEN
  open_reason: the corrected staggered-adoption estimators are the ones to use and no work is
    scheduled to build them. Two-way fixed effects is a weighted average of
    all two-by-two comparisons including late against already-treated, with weights that can be
    negative, so the naive estimator is a different quantity rather than a conservative version of
    this one. record/arms.py records the adoption step per arm and reports when two arms differ in
    it; no estimator exists. The group is reward.affine because under the group z-score the trained
    policy is unchanged by an affine rescaling of the reward, so an effect on a behavioural outcome
    is invariant and one on a reward-scale outcome is covariant with weight 1; E13 puts the status
    on the relation, so the group is right either way and the relation settles with the estimator.
  errata: E29
- id: run.max_staleness
  unit:
    as_printed: steps
    dimension: count
    per: step
    scale: null
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - H5
  wedge: true
  definition: The largest staleness in optimizer steps over the segment provenance and the staleness
    histograms of a window.
  interpretation: The NEAR_POLICY precondition. Above the bound, the importance weights an estimator
    would need are not in the record.
  support: OPEN
  errata: E29
- id: run.curriculum_response
  unit:
    as_printed: rho
    dimension: correlation
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: RECORD
  rungs: 1
  instrument:
  - H5
  wedge: true
  definition: The rank-biserial correlation between a task's mean score at a step and its presence at
    the next, pooled over consecutive step pairs in a window.
  interpretation: The EXOGENOUS_CURRICULUM precondition. Nonzero means the score is on both sides of
    any estimate taken over this window.
  support:
  - -1.0
  - 1.0
  errata: E29
- id: run.compaction_events
  unit:
    as_printed: count
    dimension: count
    per: null
    scale: null
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - H5
  wedge: true
  definition: The number of lossy compaction events strictly inside a measurement window.
  interpretation: The NO_COMPACTION precondition. Above zero, per-token importance ratios crossing
    the boundary are undefined rather than stale.
  support: OPEN
  errata: E29
- id: run.importance_ess
  unit:
    as_printed: '1'
    dimension: '1'
    per: token
    scale: normalised
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - H5
  wedge: true
  definition: Kish's effective sample size over the exponentiated difference of the training and
    sampling logprobs, as a fraction of the tokens carrying both streams.
  interpretation: The ESS_ADEQUATE precondition. It conflates policy drift with the train-inference
    engine mismatch E6 measures and cannot separate them, which the reading says.
  support:
  - 0.0
  - 1.0
  errata: E29
- id: run.mask_signature
  unit:
    as_printed: count
    dimension: count
    per: null
    scale: null
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - H5
  wedge: true
  definition: The number of distinct loss-mask states recorded for any single turn role across a
    window.
  interpretation: The MASK_STABLE precondition. Above one, per-token quantities in the window are not
    on a common basis.
  support: OPEN
  errata: E29
- id: study.pooled_effect
  unit:
    as_printed: OPEN
    dimension: OPEN
    per: OPEN
    scale: OPEN
    open_reason: a pooled effect inherits the unit of the effect measure it pools
  invariance_group: units
  min_access: design
  rungs: 1
  instrument: OPEN
  wedge: false
  definition: The random-effects pooled estimate over a set of studies, with the estimator of the
    between-study variance named on the reading.
  interpretation: The confidence interval is about the mean effect and the prediction interval is
    about the effect in a new study. Reporting only the first overstates what is known, and with real
    heterogeneity the two differ a lot.
  support: OPEN
  errata: E29
- id: study.tau2
  unit:
    as_printed: OPEN
    dimension: OPEN
    per: OPEN
    scale: OPEN
    open_reason: the between-study variance is in the square of the effect measure's unit
  invariance_group: units
  min_access: design
  rungs: 3
  instrument: OPEN
  wedge: false
  definition: The between-study variance of a random-effects meta-analysis, by DerSimonian-Laird,
    Paule-Mandel or restricted maximum likelihood, reported with a Q-profile interval.
  interpretation: An estimate of zero is not evidence of homogeneity. At small k, Cochran's Q detects
    heterogeneity equal to the typical within-study variance well under half the time, so the
    interval carries the information the point estimate does not.
  support:
  - 0.0
  - null
  errata: E29
- id: study.prediction_interval_ratio
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: units
  min_access: design
  rungs: 1
  instrument: OPEN
  wedge: false
  definition: The width of the prediction interval divided by the width of the confidence interval,
    on the analysis scale.
  interpretation: One means the two coincide, which happens exactly when the between-study variance
    is estimated at zero and is where a reader following a package default prints the same pair twice
    and ends up with no interval about a new study at all.
  support:
  - 1.0
  - null
  errata: E29
# Five rows adjudicated later, from six ids the modules computed and declined to invent.
# Three register what B2 and B3 already compute; two split one id that could not state its own
# invariance. The sixth, `grader.copeland_slater_disagreement`, is refused rather than deferred: the
# statistical review measured it at 0.1813 against an achievable range over tie-breaks of
# [0.0200, 0.4820], with 1,163 of 3,000 groups carrying a tied Copeland maximum, and a number that
# moves 24-fold on an arbitrary tie-break is not a measurement. An id is what would let it be stored,
# compared and ranked, so it does not get one.
- id: grader.houtman_maks_index
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - B2
  wedge: true
  definition: >-
    The fraction of recorded pairwise verdicts that lie in the largest subset a single utility can
    order. `measure/composition/revealed.py:838` computes it exactly up to eight items per set and
    brackets it above that, reporting `lower_fraction` and `upper_fraction` rather than a point when
    the exact search is out of reach.
  interpretation: >-
    One minus this is the share of the record that has to be thrown away before the grader looks like
    it is maximising anything. It stays informative on purely ordinal data, where the Afriat index
    cannot, which is why B2's refusal path points here.
  support:
  - 0.0
  - 1.0
- id: grader.money_pump_index
  unit:
    as_printed: reward
    dimension: reward
    per: null
    scale: raw
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - B2
  wedge: true
  definition: >-
    The mean margin around each of the grader's own preference cycles, averaged over the cycles
    enumerated. `measure/composition/revealed.py:925` walks each simple cycle x1 > x2 > ... > xk > x1
    and takes the mean of its step margins, so a cycle decided by hairs costs nearly nothing and one
    decided by wide margins all the way round costs a great deal.
  interpretation: >-
    What an arbitrageur could extract per trade by walking the grader in a circle. It is in the
    grader's own reward units, so it is not comparable across graders without a common scale, and it
    is a magnitude rather than a rate. Covariant under `reward.affine`, scaling by |a|, because a
    margin is a difference of scores and the offset cancels.
  support:
  - 0.0
  - null
- id: grader.null_reach
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  # `group.permutation` rather than B3's own `reward.null`. The reach is what measures whether
  # `reward.null` holds, so declaring it invariant under the group it is testing would assert the
  # thing under test. Reordering rollouts within a group cannot change the fraction of rollouts whose
  # score moved, which is a property that really holds and gives the generated test something to
  # check. This mirrors B5, whose quantity is the distance from scalar representability and whose
  # envelope therefore does not require it.
  invariance_group: group.permutation
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - B3
  wedge: true
  definition: >-
    The fraction of rollouts whose composed score moved when a per-prompt constant was added below a
    named node of the composition tree. `measure/composition/composition.py:508` computes it as
    n_reached / n over the rollouts that are comparable; an abstaining rollout has no advantage in
    either arm and is counted in neither direction, because folding it in would make an
    all-abstaining group look like a perfectly cancelling one.
  interpretation: >-
    Zero or one means the constant reached none of the group or all of it, the group mean moved by
    the same amount, and the `reward.null` invariance is exact. Anything strictly between them is the
    invariance failing, and a hard override is the thing that makes it happen, because a constant
    added below an override never reaches the rollouts the override pinned.
  support:
  - 0.0
  - 1.0
- id: grader.score_sigma
  unit:
    as_printed: reward
    dimension: reward
    per: null
    scale: raw
  invariance_group: reward.affine
  min_access: GRADER:REPLICATE
  rungs: 3
  instrument:
  - A6
  wedge: true
  definition: >-
    The pooled within-item standard deviation of a grader's repeated scores at fixed input, on the
    grader's own scale. `measure/metrology/distribution.py` computes it from the within-item variance
    with the per-item spreads kept beside it, because a grader at sigma = 0.18 on average and
    sigma = 0.7 on its worst decile is a different instrument from one at 0.25 everywhere.
  interpretation: >-
    How much of the score is the grader arguing with itself. Covariant under `reward.affine`, scaling
    by |a|, which is the whole reason this is not one id with the flip rate.
  support:
  - 0.0
  - null
- id: grader.flip_rate
  unit:
    as_printed: '1'
    dimension: '1'
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:REPLICATE
  rungs: 3
  instrument:
  - A6
  wedge: true
  definition: >-
    The probability that a pairwise verdict disagrees with its own modal verdict, as a U-statistic
    over all repeat combinations rather than over a diagonal pairing. The diagonal depends on an
    ordering the data does not carry unless the caller declares `paired_occasions`, which is why it
    is not the default.
  interpretation: >-
    How often re-running the same comparison changes which side wins, which is the pairwise cost of
    the spread `grader.score_sigma` reports. Invariant under `reward.affine`: an affine rescaling of
    the scores cannot change which of two is larger.
  support:
  - 0.0
  - 1.0
- id: forecast.brier_score
  unit:
    as_printed: '1'
    dimension: probability
    per: forecast
    scale: raw
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - J6
  wedge: true
  definition: the mean squared error of a set of probability forecasts against their realised binary
    outcomes, on the half-Brier convention of one term per forecast. Void resolutions are excluded
    from the numerator and from n, and the count of them travels with the score, because scoring an
    unresolvable call as a miss and dropping it are different numbers and the reader has to see which
    was done.
  interpretation: lower is better and the number alone means nothing. A Brier score is only
    interpretable against the base rate of its own reference class, which is why the uncertainty term
    of the Murphy decomposition ships beside it.
- id: forecast.calibration_reliability
  unit:
    as_printed: '1'
    dimension: probability
    per: forecast
    scale: raw
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - J6
  wedge: true
  definition: the reliability term of the Murphy decomposition, the binned mean squared gap between
    a forecast probability and the realised frequency at that probability. Lower is better and zero
    means the stated probabilities are the observed frequencies.
- id: forecast.calibration_resolution
  unit:
    as_printed: '1'
    dimension: probability
    per: forecast
    scale: raw
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - J6
  wedge: true
  definition: the resolution term of the Murphy decomposition, how far the binned outcome
    frequencies sit from the overall base rate. Higher is better, and it is the term that separates a
    forecaster who says something from one who is merely well calibrated to the climatology.
- id: forecast.decision_value
  unit:
    as_printed: loss per event
    dimension: '1'
    per: forecast
    scale: raw
  invariance_group: units
  min_access: RECORD
  rungs: 1
  instrument:
  - J6
  wedge: true
  definition: the expected loss saved per event by acting on the forecast rather than on the best
    mandatory baseline, under the forecast's own DecisionSpec. Covariant under a rescaling of the
    loss, which is why the group is units and not none.
  interpretation: the number that answers "so what", and nobody in this field computes it. It can be
    exactly zero while the Brier score looks informative, which happens whenever the forecast and the
    baseline act identically at every threshold the DecisionSpec admits.
- id: grader.design_balance
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: null
  invariance_group: none
  min_access: RECORD
  rungs: 1
  instrument:
  - A2
  wedge: false
  definition: the fraction of cells of a fully crossed measurement design that were actually
    observed. One means every subject was scored by every rater at every occasion, which is the
    design the expected-mean-square inversion is derived for. Below one the inversion is being
    applied to a design it does not describe.
  interpretation: what DESIGN_CROSSED is measured by. It is a property of a measurement design and
    not of a training run, so it is not determinable from a bare record and `measure_regime` reports
    it as unknown rather than as a pass, which is the third state that exists for exactly this case.
- id: policy.readout_recoverability
  unit:
    as_printed: fraction
    dimension: fraction
    per: null
    scale: null
  invariance_group: repr.basis
  min_access: POLICY:FORWARD
  rungs: 1
  instrument:
  - C9
  wedge: false
  definition: how much of a held-out outcome a linear readout of the policy's own residual stream
    recovers, cross-fitted, scored against the black-box baseline bank on the same items. A fraction
    because it is an accuracy, and it travels with the four numbers of an IncrementalValidity rather
    than alone.
  interpretation: 'the number is uninterpretable without its baseline, which is why the instrument
    refuses to emit one without it. The bar for a white-box method is decorrelation plus signal
    rather than superiority. A probe ten points worse than the best black-box baseline and
    uncorrelated with it is worth more than one two points better and redundant.'
