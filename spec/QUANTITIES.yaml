# The quantity registry. 179 rows, 103 in the wedge, 37 declaring no group. 124 come from the
# source quantity table; the other 55 arrived as later corrections, under the `errata` tags the
# rows themselves carry: E10 (1), E14 (3), E19 (28), E22 (3), E23 (5), E29 (10), and five
# adjudicated later and listed at the foot of this file. Five source rows carry an amended unit
# decomposition under E15.
#
# The counts are derived from the rows, not restated from the prose. The source table's own header
# says "126 quantities, of which 68 are in the wedge" and the table has 124 rows and 69 markers,
# which is a defect on record; the instruction "if you edit a row, recount" sits at the top of both
# files and three errata edited rows before anyone did. The wedge count later moved from 85 to 103:
# thirteen of the 28 retrofit rows are in the wedge on their own `min_access` and were marked out
# of it, and five new rows are in it.
#
# Unit decomposition into (dimension, per, scale) is this build's, because the source table prints
# one undecomposed token per row and no Unit body appears in either document. `as_printed` always
# carries the source token so the decomposition is checkable.
#
# One row is not from the source quantity table. `credit.successor_representation` is named only in
# a prose footnote, which is the same defect the later document criticises the earlier one
# for. It is registered here so the docs build can name it as an open research target, which is
# what the footnote asks for and what a prose-only mention cannot deliver.
#
# Three more are named in the source instrument entries and have no quantity-table row either:
# `verifier.fp_catalogue` (D5), `verifier.trusted_inputs` (D9) and
# `selection.dimensionality` (F5). Registered here for the same reason, marked
# `errata: E14`. Two further ids in the instrument entries, `grader.condorcet` and
# `reference.u_char`, are alternate spellings of `grader.condorcet_rate` and
# `reference.u_characterisation`, which the table does carry; those are not registered twice.
quantities:
- id: grader.effective_group_size
  unit:
    as_printed: count
    dimension: count
    per: group
    scale: null
  # Amended: `per` was null, which merged this with `verifier.surviving_mutants`, a count with
  # no denominator at all. The A1 instrument entry defines it over "a group of K rollouts" and reports it
  # as "4.2, not 16", where 16 is K. `group` is one of the four `per` values the Unit class
  # names and no row used it. See errata E15.
  errata: E15
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 4
  instrument:
  - A1
  wedge: true
  # Filled when A1 stopped multiplying the Kish shape factor into this quantity. The
  # three fields were OPEN because nobody had had to say precisely what the number was until the
  # correction forced the question. Lifted verbatim from `EFFECTIVE_GROUP_SIZE` in
  # `measure/metrology/gstudy.py`, which is the declaration the instrument is checked against.
  definition: >-
    For a group of K rollouts scored on one prompt under one grader configuration: the number of
    noiselessly scored rollouts that would carry the same amount of signal as the K observed
    scores. It is K times the generalizability coefficient of a single observed score over the
    declared universe of grader draws, sigma2(tau) / (sigma2(tau) + sigma2(delta)) at one draw of
    every facet, which is 1 for a noiseless grader and falls toward 0 as measurement error takes
    over the observed spread. Every rung of the ladder estimates this one number and differs only
    in which error terms its design can see, so rung 0, which can see none, returns exactly K. The
    shape of the reward distribution inside the group does not enter: how unevenly a group spends
    its gradient is a fact about the policy and the reward, not about the grader, and it is
    reported separately as the group's Kish shape factor.
  interpretation: >-
    Compare it to K. n_eff = 4.2 at K = 16 means eleven point eight rollouts' worth of compute
    bought grader noise rather than an independent gradient-relevant observation. The rung tells
    you how much of the grader's error the number could see: below rung 3 some error terms are
    invisible and are counted as signal, so the reading is an upper bound and the invisible terms
    are named on it.
  support:
  - 0.0
  - .inf
- id: run.group_shape_factor
  unit:
    as_printed: fraction
    dimension: ratio
    per: group
    scale: null
  # Registered to carry the half of the old `grader.effective_group_size` that was
  # never a property of the grader. A1 multiplied Kish's shape factor by the reliability and
  # called the product an effective group size; the two answer different questions and their
  # product is not a quantity. The shape factor asks how unequal the deviations within a group
  # are, which is a fact about the policy and the reward. The reliability asks how much of the
  # observed variance is true score, which is a fact about the grader. This id exists so the
  # first one can be reported, compared and stored on its own terms rather than smuggled into
  # the second.
  #
  # It is `run.` rather than `grader.` deliberately: filing it under `grader.` would re-assert
  # the exact conflation the correction removed.
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - A1
  wedge: true
  definition: >-
    For a group of K rollouts, Kish's shape factor on the group's centred scores,
    (sum w)^2 / (K * sum w^2), which is 1 when every rollout deviates from the group mean by the
    same magnitude and falls toward 0 as the group's gradient signal concentrates in fewer and
    fewer rollouts. It is computed on the observed scores, so it carries grader noise, and it is
    reported as a property of the group rather than of the grader for that reason.
  interpretation: >-
    How evenly a group spends its gradient. A value near 1 means every rollout in the group is
    contributing comparably to the advantage; a low value means a few rollouts carry the update
    and the rest are close to the mean. Measured across eleven real reward models it runs 0.7346
    to 0.7562 with a spread of 0.0216, which is where the per-grader variation in the old
    effective-group-size reading was coming from.
  support:
  - 0.0
  - 1.0
# ---------------------------------------------------------------------------
# Series N5-N8, the contract layer.
#
# These exist because nothing was scheduled for the contract layer and the mathematics
# there is pure wedge. The instruments were built and shipped; their
# catalogue rows and these four quantity ids were never written, so four shipped instruments were
# failing `lint_instrument` rule 1 for some time while the schedule read `done`. Found
# while enumerating the registry for something else, which is the third
# time in this build that an enumeration-as-a-test caught a hole nobody was looking for.
#
# The invariance declarations are the shipped instruments' own and they were thought through:
# `reward.optimal_weights` is **covariant at weight -1** under `reward.affine`, because if the
# reward scales by `a` the weight that keeps the incentive constant scales by `1/a`. The other three
# are ratios and cosines of things that scale together, so they are invariant.
- id: reward.optimal_weights
  unit:
    as_printed: weight
    dimension: '1'
    per: component
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 2
  instrument:
  - N5
  wedge: true
  definition: >-
    The weight a reward component should carry in a composite reward given its measured noise:
    alpha* = (I + r C'' Sigma)^-1 B', and in the diagonal case alpha*_i = B_i / (1 + r C_ii
    sigma_i^2). Holmstrom and Milgrom (1991) under CARA and Brownian noise, with the ordering
    C'' before Sigma, since matrix products do not commute and at least one transcription in this
    project's own corpus has them the other way round.
  interpretation: >-
    A component's optimal weight falls as its measurement noise rises, and the shrinkage factor is
    the same object as the regressional-Goodhart factor Var(X)/(Var(X)+Var(Z)), derived by contract
    theory as what the principal should do and by the Goodhart literature as what happens if you do
    not. Ships as a design check with its five assumptions printed, not as a law.
  support: OPEN
- id: reward.equal_compensation_ratio
  unit:
    as_printed: varrho
    dimension: ratio
    per: component
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 2
  instrument:
  - N6
  wedge: true
  definition: >-
    The information coefficient varrho(k) = n(k)/t(k) with n(k) = sigma^2(k)/mu'(t(k),k)^2, per
    component of a composite reward. After dividing each signal by its own sensitivity mu', the
    commissions must be equal, so the raw weights must satisfy alpha_i proportional to mu'_i.
  interpretation: >-
    Whether the reward is mis-weighted, and if so which component is being starved: the one with
    the lowest alpha_i/mu'_i. The phrase "equal compensation principle" is Milgrom and Roberts
    (1992) and does not appear in Holmstrom and Milgrom (1991). The source description states the
    principle backwards, and on a real panel the printed rule and the correct one name opposite ends.
  support: OPEN
- id: reward.sorting_cutoff
  unit:
    as_printed: varrho
    dimension: ratio
    per: component
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 1
  instrument:
  - N7
  wedge: true
  definition: >-
    The value of the information coefficient varrho at which components should be separated into
    different incentive contracts rather than summed into one.
  interpretation: >-
    Do not put a noisy judge and a crisp unit test in the same weighted sum. Split them across
    separate optimisation stages, separate models, or separate gradient paths. The optimum is
    provably asymmetric, so symmetric treatment of components whose noise differs at all is
    suboptimal.
  support: OPEN
- id: reward.component_congruity
  unit:
    as_printed: cos
    dimension: correlation
    per: component
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:RECORD
  rungs: 2
  instrument:
  - N8
  wedge: true
  definition: >-
    Congruity = cos of the angle between M-transpose alpha and B', per reward component, with
    Distortion = 1 - Congruity travelling beside it.
  interpretation: >-
    Every reward component needs at least two numbers, a noise and an angle, and no RLHF tooling
    separates them. A noisy but congruent measure wants a lower weight; a precise but distorted
    measure wants a different measure. Those are different remedies and one number cannot
    distinguish them.
  support:
  - -1.0
  - 1.0
- id: grader.variance_components
  unit:
    as_printed: var
    dimension: variance
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:REPLICATE
  rungs: 4
  instrument:
  - A2
  wedge: true
  # Lifted from the `Quantity` this package has carried since it was written. The module
  # held the definition because `spec/QUANTITIES.yaml` was not that module's file to write,
  # and `test_the_registry_carries_no_definition_for_any_of_them` was left as a tripwire so
  # the duplicate would be deleted when the row landed rather than drifting against it.
  definition: >-
    The decomposition of the variance of a single grader score into additive components, one per
    source of variation in a fully crossed design: the object of measurement, each facet of the
    measurement procedure, every interaction among them, and a residual. In a crossed
    object-by-rater-by-occasion design with one observation per cell the components are sigma2(p),
    sigma2(r), sigma2(o), sigma2(pr), sigma2(po), sigma2(ro) and sigma2(pro,e), estimated by
    inverting the expected mean squares. The three-way interaction and the residual are one term
    because a design with one observation per cell cannot separate them. Components are truncated at
    zero and every truncation is recorded, because a negative estimate means the true component is
    near zero and the design could not resolve it, which is a different statement from an
    established zero.
  interpretation: >-
    Read the shares, not the values: the values are in the square of whatever units the grader emits
    and are not comparable across graders. A large sigma2(r) share means the score depends on which
    judge you drew. A large sigma2(pr) share means the judges disagree about which response is
    better, which is the term a group-relative estimator cannot cancel.
  support: OPEN
- id: grader.grr_percent
  unit:
    as_printed: '%'
    dimension: percent
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:REPLICATE
  rungs: 1
  instrument:
  - A2
  wedge: true
  # Lifted from the `Quantity` this package has carried since it was written. The module
  # held the definition because `spec/QUANTITIES.yaml` was not that module's file to write,
  # and `test_the_registry_carries_no_definition_for_any_of_them` was left as a tripwire so
  # the duplicate would be deleted when the row landed rather than drifting against it.
  definition: >-
    100 * sigma_GRR / sigma_total, where sigma_total is the standard deviation of a single score and
    sigma_GRR is the square root of the total variance minus the variance of the object of
    measurement. Everything that is not the object is gauge: facet main effects, object-by-facet
    interactions, facet-by-facet interactions and the residual. A ratio of standard deviations,
    following the automotive convention, and not of variances.
  interpretation: >-
    Under 10% the measurement system is acceptable, 10 to 30 is conditional on what the measurement
    is for, over 30 is not acceptable for process control. At 61% most of what you are ranking on is
    the measurement rather than the thing measured.
  support: OPEN
- id: grader.ndc
  unit:
    as_printed: count
    dimension: count
    per: null
    scale: null
  invariance_group: reward.affine
  min_access: GRADER:REPLICATE
  rungs: 1
  instrument:
  - A2
  wedge: true
  # Lifted from the `Quantity` this package has carried since it was written. The module
  # held the definition because `spec/QUANTITIES.yaml` was not that module's file to write,
  # and `test_the_registry_carries_no_definition_for_any_of_them` was left as a tripwire so
  # the duplicate would be deleted when the row landed rather than drifting against it.
  definition: >-
    1.41 * sigma_part / sigma_GRR, truncated to an integer: the number of distinct non-overlapping
    categories the measurement system can sort the population of objects into. The 1.41 is the
    square root of two, from the width of the distribution of true values relative to the width of
    the measurement error.
  interpretation: >-
    Five or more is the threshold for using a gauge to control a process. Two means the gauge can
    tell good from bad and nothing finer, so it cannot resolve two adjacent models. One means it
    cannot do that either.
  support: OPEN
